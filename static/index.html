<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ASX Workbench</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f8;
        --surface: #ffffff;
        --surface-soft: #eef2f6;
        --text: #122033;
        --muted: #5b6678;
        --line: #d6dde6;
        --accent: #214f9b;
        --accent-soft: #dbe6fb;
        --good: #1c7c54;
        --warn: #9a6700;
        --bad: #b42318;
        --shadow: 0 8px 22px rgba(18, 32, 51, 0.08);
        --radius: 8px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: linear-gradient(180deg, #f7f9fc 0%, var(--bg) 100%);
        color: var(--text);
        font: 16px/1.5 "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      .shell {
        max-width: 1320px;
        margin: 0 auto;
        padding: 20px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .brand h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: 0;
      }
      .brand .meta, .statusline {
        color: var(--muted);
        font-size: 12px;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button, input {
        font: inherit;
      }
      input {
        width: 220px;
        min-height: 44px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--text);
        min-height: 44px;
        padding: 10px 14px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #fff;
        border-color: var(--accent);
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }
      .toolbar a, .toolbar button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 16px;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px 16px;
      }
      .panel h2 {
        margin: 0 0 10px;
        font-size: 16px;
        line-height: 1.25;
      }
      .subtle {
        color: var(--muted);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }
      .stat {
        background: var(--surface-soft);
        border-radius: 6px;
        padding: 12px;
        min-height: 84px;
      }
      .stat .label {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 6px;
      }
      .stat .value {
        font-size: 22px;
        font-weight: 650;
        line-height: 1.1;
      }
      .stat .note {
        margin-top: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .table {
        width: 100%;
        border-collapse: collapse;
      }
      .table th, .table td {
        border-top: 1px solid var(--line);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
      }
      .table th {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        background: var(--surface-soft);
        color: var(--text);
      }
      .pill.good { background: rgba(28, 124, 84, 0.12); color: var(--good); }
      .pill.warn { background: rgba(154, 103, 0, 0.12); color: var(--warn); }
      .pill.bad { background: rgba(180, 35, 24, 0.12); color: var(--bad); }
      .list {
        display: grid;
        gap: 10px;
      }
      .item {
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .item:first-child { border-top: 0; padding-top: 0; }
      .item h3 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      .item p {
        margin: 0;
        color: var(--muted);
      }
      .empty {
        padding: 12px;
        border: 1px dashed var(--line);
        border-radius: 6px;
        color: var(--muted);
        background: #fbfcfe;
      }
      .error {
        border-color: rgba(180, 35, 24, 0.28);
        background: rgba(180, 35, 24, 0.06);
        color: var(--bad);
      }
      @media (max-width: 1040px) {
        .grid { grid-template-columns: 1fr; }
        .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .actions { flex-wrap: wrap; justify-content: flex-start; }
      }
      @media (max-width: 720px) {
        .shell { padding: 14px; }
        .topbar { flex-direction: column; align-items: flex-start; }
        .stats { grid-template-columns: 1fr; }
        input { width: 100%; }
        .actions { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="topbar">
        <div class="brand">
          <h1>ASX Workbench</h1>
          <div class="meta" id="headerMeta">今天的报告、组合和配置都在这里。</div>
        </div>
        <div class="actions">
          <input id="tokenInput" type="password" placeholder="访问令牌（如需要）" autocomplete="off" />
          <button id="saveTokenBtn">保存</button>
          <button class="primary" id="refreshBtn">刷新</button>
        </div>
      </div>

      <div class="toolbar">
        <a href="/api/v1/history" class="pill">历史报告</a>
        <a href="/api/v1/history/portfolio/summary" class="pill">组合摘要</a>
        <a href="/api/v1/backtest/performance" class="pill">回测概览</a>
        <a href="/api/v1/paper-portfolio/overview" class="pill">模拟盘</a>
        <a href="/api/v1/system/config" class="pill">配置</a>
      </div>

      <div class="grid">
        <div class="stack">
          <section class="panel">
            <h2>今天要先看什么</h2>
            <div class="stats" id="stats"></div>
          </section>

          <section class="panel">
            <h2>最新日报</h2>
            <div id="latestReport" class="empty">正在读取最新报告...</div>
          </section>

          <section class="panel">
            <h2>历史报告</h2>
            <div id="historyList" class="list"></div>
          </section>
        </div>

        <div class="stack">
          <section class="panel">
            <h2>组合与风险</h2>
            <div id="portfolioBlock" class="empty">正在读取组合信息...</div>
            <div id="riskBlock" style="margin-top: 12px;"></div>
          </section>

          <section class="panel">
            <h2>回测概览</h2>
            <div id="backtestBlock" class="empty">正在读取回测汇总...</div>
          </section>

          <section class="panel">
            <h2>基础配置状态</h2>
            <div id="configBlock" class="empty">正在读取配置状态...</div>
          </section>
        </div>
      </div>
    </div>

    <script>
      const state = {
        token: localStorage.getItem('asx.workbench.token') || '',
        data: null,
      };

      const els = {
        headerMeta: document.getElementById('headerMeta'),
        tokenInput: document.getElementById('tokenInput'),
        saveTokenBtn: document.getElementById('saveTokenBtn'),
        refreshBtn: document.getElementById('refreshBtn'),
        stats: document.getElementById('stats'),
        latestReport: document.getElementById('latestReport'),
        historyList: document.getElementById('historyList'),
        portfolioBlock: document.getElementById('portfolioBlock'),
        riskBlock: document.getElementById('riskBlock'),
        backtestBlock: document.getElementById('backtestBlock'),
        configBlock: document.getElementById('configBlock'),
      };

      els.tokenInput.value = state.token ? '********' : '';

      els.saveTokenBtn.addEventListener('click', () => {
        const value = els.tokenInput.value.trim();
        state.token = value === '********' ? state.token : value;
        localStorage.setItem('asx.workbench.token', state.token);
        els.headerMeta.textContent = state.token ? '已保存访问令牌。' : '未设置访问令牌。';
      });

      els.refreshBtn.addEventListener('click', loadSummary);

      async function fetchJson(url) {
        const headers = {};
        if (state.token) headers.Authorization = `Bearer ${state.token}`;
        const response = await fetch(url, { headers });
        const text = await response.text();
        let payload = {};
        try { payload = text ? JSON.parse(text) : {}; } catch (_error) { payload = { raw: text }; }
        if (!response.ok) {
          const message = payload?.detail?.message || payload?.message || response.statusText;
          throw new Error(`${response.status}: ${message}`);
        }
        return payload;
      }

      function pill(label, tone = '') {
        return `<span class="pill ${tone}">${escapeHtml(label)}</span>`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;');
      }

      function money(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return 'N/A';
        return new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: 2 }).format(num);
      }

      function fmt(value) {
        return value == null || value === '' ? 'N/A' : String(value);
      }

      function pct(value) {
        const num = Number(value);
        if (!Number.isFinite(num)) return 'N/A';
        return `${num.toFixed(1)}%`;
      }

      function riskLabel(category) {
        const value = String(category || '');
        if (value === 'BLOCK') return '阻断';
        if (value === 'Data gap') return '数据缺口';
        if (value === 'Report') return '报告';
        return value || '提示';
      }

      function renderStats(data) {
        const latest = data.latest_report || {};
        const portfolio = data.portfolio || {};
        const risk = data.risk || {};
        const config = data.config_status || {};
        const items = [
          {
            label: '最新报告',
            value: latest.query_id ? '1' : '0',
            note: latest.stock_code ? `${latest.stock_code} · ${fmt(latest.validation_status)}` : '还没有可用报告',
          },
          {
            label: '组合总值',
            value: money(portfolio.total_value),
            note: `${fmt((portfolio.holdings || []).length)} 只持仓`,
          },
          {
            label: 'BLOCK / 缺口',
            value: `${fmt(risk.blocked_count || 0)} / ${fmt(risk.data_gap_count || 0)}`,
            note: `${fmt((risk.items || []).length)} 条复核提示`,
          },
          {
            label: '配置状态',
            value: config.status === 'available' ? '正常' : '异常',
            note: `自选股 ${config.stock_list_configured ? '已配' : '未配'} · 秘钥 ${fmt(config.secrets_configured || 0)} 个`,
          },
        ];
        els.stats.innerHTML = items.map((item) => `
          <div class="stat">
            <span class="label">${escapeHtml(item.label)}</span>
            <div class="value">${escapeHtml(item.value)}</div>
            <div class="note">${escapeHtml(item.note)}</div>
          </div>
        `).join('');
      }

      function renderLatest(data) {
        const latest = data.latest_report || {};
        if (latest.status === 'missing') {
          els.latestReport.innerHTML = '<div class="empty">今天还没有日报。</div>';
          return;
        }
        const bits = [
          latest.report_date ? `<div>${pill(fmt(latest.report_date), 'good')}</div>` : '',
          `<h3 style="margin:10px 0 6px;">${escapeHtml(fmt(latest.stock_code))} ${escapeHtml(fmt(latest.stock_name))}</h3>`,
          `<p class="subtle" style="margin:0 0 10px;">${escapeHtml(fmt(latest.analysis_summary))}</p>`,
          `<div class="toolbar" style="margin:0 0 10px;">${pill(`价格口径 ${fmt(latest.price_policy)}`)}${pill(`验证 ${fmt(latest.validation_status)}`, latest.validation_status === 'BLOCK' ? 'bad' : 'good')}${pill(`动作 ${fmt(latest.position_action)}`)}</div>`,
          `<div class="statusline">报告路径：<a href="${escapeHtml(latest.detail_path || '#')}">${escapeHtml(latest.detail_path || 'N/A')}</a></div>`,
        ];
        els.latestReport.innerHTML = bits.join('');
      }

      function renderHistory(data) {
        const items = data.history?.items || [];
        if (!items.length) {
          els.historyList.innerHTML = '<div class="empty">没有历史报告。</div>';
          return;
        }
        els.historyList.innerHTML = items.map((item) => `
          <div class="item">
            <h3><a href="/api/v1/history/${encodeURIComponent(item.query_id)}">${escapeHtml(fmt(item.stock_code))}</a></h3>
            <p>${escapeHtml(fmt(item.stock_name))} · ${escapeHtml(fmt(item.report_type))} · ${escapeHtml(fmt(item.created_at))}</p>
            <div class="statusline">建议：${escapeHtml(fmt(item.operation_advice))} · 评分：${escapeHtml(fmt(item.sentiment_score))}</div>
          </div>
        `).join('');
      }

      function renderPortfolio(data) {
        const portfolio = data.portfolio || {};
        const paper = data.paper_portfolio || {};
        const holdings = portfolio.holdings || [];
        const paperSummary = paper.status === 'unavailable'
          ? '不可用'
          : paper.initialized
            ? money(paper.total_value)
            : '未初始化';
        const rows = holdings.length
          ? `
            <table class="table">
              <thead>
                <tr>
                  <th>标的</th>
                  <th>数量</th>
                  <th>市值</th>
                  <th>权重</th>
                </tr>
              </thead>
              <tbody>
                ${holdings.map((row) => `
                  <tr>
                    <td>${escapeHtml(fmt(row.code || row.name))}</td>
                    <td>${escapeHtml(fmt(row.quantity))}</td>
                    <td>${escapeHtml(money(row.market_value))}</td>
                    <td>${escapeHtml(fmt(row.weight))}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `
          : '<div class="empty">当前没有持仓。</div>';
        els.portfolioBlock.innerHTML = `
          <div class="toolbar" style="margin-bottom:10px;">
            ${pill(`现金 ${money(portfolio.cash)}`)}
            ${pill(`总值 ${money(portfolio.total_value)}`)}
            ${pill(`持仓 ${holdings.length}`)}
            ${pill(`模拟盘 ${paperSummary}`)}
          </div>
          ${rows}
        `;

        const riskItems = data.risk?.items || [];
        els.riskBlock.innerHTML = riskItems.length
          ? `<div class="list">${riskItems.map((item) => `
              <div class="item">
                <h3>${escapeHtml(riskLabel(item.category))}${item.code ? ` · ${escapeHtml(fmt(item.code))}` : ''}</h3>
                <p>${escapeHtml(fmt(item.issue))}</p>
              </div>
            `).join('')}</div>`
          : '<div class="empty">当前没有需要复核的阻断或数据缺口。</div>';
      }

      function renderBacktest(data) {
        const backtest = data.backtest || {};
        if (backtest.status !== 'available') {
          els.backtestBlock.innerHTML = `<div class="empty">${escapeHtml(backtest.message || '暂无可用回测汇总。')}</div>`;
          return;
        }
        els.backtestBlock.innerHTML = `
          <div class="toolbar" style="margin-bottom:10px;">
            ${pill(`窗口 ${fmt(backtest.eval_window_days)} 天`)}
            ${pill(`已完成 ${fmt(backtest.completed_count)} / ${fmt(backtest.total_evaluations)}`)}
            ${pill(`胜率 ${pct(backtest.win_rate_pct)}`)}
            ${pill(`方向 ${pct(backtest.direction_accuracy_pct)}`)}
          </div>
          <div class="statusline">
            平均模拟收益：${escapeHtml(pct(backtest.avg_simulated_return_pct))} ·
            最近计算：${escapeHtml(fmt(backtest.computed_at))} ·
            <a href="/api/v1/backtest/performance">查看详情</a>
          </div>
        `;
      }

      function renderConfig(data) {
        const config = data.config_status || {};
        els.configBlock.innerHTML = `
          <div class="toolbar" style="margin-bottom:10px;">
            ${pill(config.status === 'available' ? '正常' : '异常', config.status === 'available' ? 'good' : 'bad')}
            ${pill(`自选股 ${config.stock_list_configured ? '已配置' : '未配置'}`)}
            ${pill(`秘钥 ${fmt(config.secrets_configured || 0)} 个`)}
          </div>
          <div class="statusline">最近更新时间：${escapeHtml(fmt(config.updated_at))}</div>
        `;
      }

      async function loadSummary() {
        els.headerMeta.textContent = '正在读取工作台信息...';
        try {
          const data = await fetchJson('/api/v1/workbench/summary');
          state.data = data;
          renderStats(data);
          renderLatest(data);
          renderHistory(data);
          renderPortfolio(data);
          renderBacktest(data);
          renderConfig(data);
          els.headerMeta.textContent = '已连接到本地工作台。';
        } catch (error) {
          const message = error?.message || '无法读取工作台信息。';
          els.headerMeta.textContent = message;
          els.stats.innerHTML = '';
          els.latestReport.innerHTML = `<div class="empty error">${escapeHtml(message)}</div>`;
          els.historyList.innerHTML = '<div class="empty error">历史报告暂时不可用。</div>';
          els.portfolioBlock.innerHTML = `<div class="empty error">${escapeHtml(message)}</div>`;
          els.riskBlock.innerHTML = '<div class="empty error">风险信息暂时不可用。</div>';
          els.backtestBlock.innerHTML = '<div class="empty error">回测汇总暂时不可用。</div>';
          els.configBlock.innerHTML = '<div class="empty error">配置状态暂时不可用。</div>';
        }
      }

      loadSummary();
    </script>
  </body>
</html>
