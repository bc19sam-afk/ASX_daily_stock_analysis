name: Record Cash

on:
  workflow_dispatch:
    inputs:
      amount:
        description: 'Cash movement amount (positive for dividends/deposits, negative for withdrawals/fees)'
        required: true
      reason:
        description: 'Reason for the cash movement'
        required: true
      code:
        description: 'Optional source code for the cash movement'
        required: false
        default: 'CASH'

concurrency:
  group: stock-analysis
  cancel-in-progress: false

jobs:
  record-cash:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/stock_analysis.db
          key: stock-db-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            stock-db-${{ runner.os }}-${{ github.ref_name }}-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Record cash movement from form inputs
        env:
          CASH_AMOUNT: ${{ github.event.inputs.amount }}
          CASH_REASON: ${{ github.event.inputs.reason }}
          CASH_CODE: ${{ github.event.inputs.code }}
        run: |
          mkdir -p data
          python -m scripts.manual_portfolio_workflows record-cash \
            --amount "$CASH_AMOUNT" \
            --reason "$CASH_REASON" \
            --code "$CASH_CODE"

      - name: Save database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/stock_analysis.db
          key: stock-db-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
